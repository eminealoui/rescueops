      DB_URL: jdbc:postgresql://postgres:5432/resource_db
      RABBIT_HOST: rabbitmq
      EUREKA_URL: http://eureka-server:8761/eureka
      KEYCLOAK_JWKS: http://keycloak:8080/realms/rescueops/protocol/openid-connect/certs
    depends_on: [postgres, rabbitmq, eureka-server]

  dispatch-service:
