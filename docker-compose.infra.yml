# =====================================================================
#  RescueOps - SOCLE PARTAGÉ (utilisé par les 6 membres de l'équipe)
#
#    cp .env.example .env            (une seule fois)
#    docker compose -f docker-compose.infra.yml up -d
#
#  Chaque membre lance ensuite SON microservice depuis IntelliJ (profil "local").
#  Ports publiés sur 127.0.0.1 uniquement : rien n'est exposé au réseau (Wi-Fi du campus),
#  car les mots de passe de développement sont publics et Eureka n'a pas d'authentification.
# =====================================================================
name: rescueops

services:

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      HOSPITAL_DB_PASSWORD: ${HOSPITAL_DB_PASSWORD}
      EMERGENCY_DB_PASSWORD: ${EMERGENCY_DB_PASSWORD}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD}
      INTERVENTION_DB_PASSWORD: ${INTERVENTION_DB_PASSWORD}
      TRAINING_DB_PASSWORD: ${TRAINING_DB_PASSWORD}
      TZ: UTC
    # 3307 côté machine : le port 3306 est souvent déjà pris par un MySQL installé sous Windows.
    ports: ["127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [rescueops-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Émetteur des tokens TOUJOURS http://localhost:8180, même vu depuis un conteneur.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      # Import au premier démarrage uniquement (un realm existant n'est pas écrasé).
      - ./infrastructure/keycloak/realm-rescueops.json:/opt/keycloak/data/import/realm-rescueops.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [rescueops-net]

  rabbitmq:
    image: rabbitmq:4.3.8-management
    # Nom de nœud fixe (rabbit@rabbitmq) : sans lui, RabbitMQ repart à vide à chaque recréation
    # du conteneur (files durables et messages en DLQ perdus).
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [rescueops-net]

  rabbitmq-init:
    image: curlimages/curl:8.17.0
    entrypoint: ["sh", "/init-exchanges.sh"]
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./infrastructure/rabbitmq/init-exchanges.sh:/init-exchanges.sh:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: "no"
    networks: [rescueops-net]

  discovery-server:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args: { MODULE: infrastructure/discovery-server, PORT: "8761" }
    image: rescueops/discovery-server:dev
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports: ["127.0.0.1:8761:8761"]
    networks: [rescueops-net]

  api-gateway:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args: { MODULE: infrastructure/api-gateway, PORT: "8080" }
    image: rescueops/api-gateway:dev
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports: ["127.0.0.1:8080:8080"]
    # Permet d'atteindre un microservice lancé depuis IntelliJ sur la machine (profil "local").
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      discovery-server: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [rescueops-net]

  # Service partagé : profils utilisateurs. Pas de port publié : on y accède par la Gateway (/api/users/**).
  ms-user:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args: { MODULE: services/ms-user, PORT: "8087" }
    image: rescueops/ms-user:dev
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${USER_DB_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [rescueops-net]

volumes:
  mysql-data:
  keycloak-data:
  rabbitmq-data:

networks:
  rescueops-net:
    name: rescueops-net
