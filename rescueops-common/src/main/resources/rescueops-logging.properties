# Format de log commun RescueOps (importé par chaque service via spring.config.import).
# L'identifiant de corrélation apparaît entre crochets ; les tokens ne sont jamais journalisés.
logging.pattern.correlation=[%X{correlationId:-}]
logging.include-application-name=true

# Réponses annoncées en UTF-8 (Content-Type: application/json;charset=UTF-8).
# Sans charset, PowerShell 5.1 (Invoke-RestMethod) décode en ISO-8859-1 : « Hôpital » devient « HÃ´pital ».
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
