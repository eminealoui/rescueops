# =====================================================================
#  Load balancer RescueOps (Nginx)
#    https://localhost:8443  -> application + API (HTTPS)
#    http://localhost:8090   -> redirige vers HTTPS ; /api reste servi en HTTP
#                               (proxy de ng serve, scripts de test)
#  Répartition : round-robin entre les 2 Gateways ; si l'une tombe, bascule sur l'autre.
# =====================================================================

# DNS interne de Docker : les adresses des Gateways sont relues si un conteneur redémarre.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateways {
    zone gateways 64k;
    # max_fails=1 fail_timeout=10s : une Gateway qui ne répond pas est écartée 10 s.
    server api-gateway-1:8080 resolve max_fails=1 fail_timeout=10s;
    server api-gateway-2:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

upstream web {
    zone web 64k;
    server web:80 resolve;
}


server {
    listen 80;
    server_name localhost;

    location = /nginx-health {
        access_log off;
        return 200 "UP\n";
    }

    location /api/ {
        include /etc/nginx/conf.d/rescueops-api.inc;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }

    location @trop_de_requetes {
        include /etc/nginx/conf.d/rescueops-429.inc;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location /api/ {
        include /etc/nginx/conf.d/rescueops-api.inc;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        include /etc/nginx/conf.d/rescueops-headers.inc;
    }

    location @trop_de_requetes {
        include /etc/nginx/conf.d/rescueops-429.inc;
    }
}
