# =====================================================================
#  Réglages globaux Nginx (chargés en premier) : rate limiting de l API par adresse IP,
#  20 requêtes/s en continu, avec une rafale de 40 acceptée (chargement d'une page).
#  Au-delà : 429 Too Many Requests en JSON (même format ProblemDetail que les microservices).
# =====================================================================
limit_req_zone  $binary_remote_addr zone=api_par_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connexions_par_ip:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# Version du serveur cachée dans les en-têtes et pages d'erreur.
server_tokens off;

# =====================================================================
#  Identifiant de corrélation : celui du client s'il est sûr, sinon un nouveau (32 caractères).
#  Transmis à la Gateway (X-Correlation-Id), qui le propage aux microservices :
#  la même valeur apparaît dans le journal Nginx et dans les logs Java -> recherche dans Grafana.
# =====================================================================
map $http_x_correlation_id $correlation_id {
    "~^[A-Za-z0-9-]{8,64}$" $http_x_correlation_id;
    default                 $request_id;
}

# Journal d'accès en JSON (une ligne par requête), lu par Alloy puis envoyé à Loki.
log_format rescueops_json escape=json
    '{"source":"nginx","time":"$time_iso8601","correlationId":"$correlation_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"duration_s":$request_time,"bytes":$body_bytes_sent,'
    '"gateway":"$upstream_addr","upstream_s":"$upstream_response_time",'
    '"client":"$remote_addr","user_agent":"$http_user_agent"}';
