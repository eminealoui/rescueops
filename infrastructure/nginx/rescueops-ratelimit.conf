# =====================================================================
#  Limitation de débit (rate limiting) de l'API, par adresse IP.
#  20 requêtes/s en continu, avec une rafale de 40 acceptée (chargement d'une page).
#  Au-delà : 429 Too Many Requests en JSON (même format ProblemDetail que les microservices).
# =====================================================================
limit_req_zone  $binary_remote_addr zone=api_par_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connexions_par_ip:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# Version du serveur cachée dans les en-têtes et pages d'erreur.
server_tokens off;
