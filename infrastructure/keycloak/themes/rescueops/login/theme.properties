# Thème RescueOps pour les pages Keycloak (connexion, inscription, mot de passe oublié...).
# Il hérite du thème standard keycloak.v2 (PatternFly 5) et ajoute seulement une feuille de style
# aux couleurs de l'application (docs/design/tokens.css) : aucun gabarit n'est recopié,
# donc les mises à jour de Keycloak restent compatibles.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/rescueops.css
