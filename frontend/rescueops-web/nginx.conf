# Nginx du conteneur "web" : sert l'application Angular et relaie /api vers la Gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API : même origine que l'application, la Gateway reste invisible pour le navigateur.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers compilés (noms avec empreinte) : cache long.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Routage Angular : toute URL inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
