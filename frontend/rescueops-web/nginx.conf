# Nginx du conteneur "web" : sert uniquement l'application Angular compilée.
# /api est routé en amont par le load balancer (infrastructure/nginx), jamais par ce conteneur.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers compilés (noms avec empreinte) : cache long.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Routage Angular : toute URL inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
