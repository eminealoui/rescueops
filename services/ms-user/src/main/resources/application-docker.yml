# Profil "docker" : ms-user tourne lui aussi dans Docker Compose (démo complète).
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/user_db

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

rescueops:
  keycloak:
    admin:
      base-url: http://keycloak:8080
  security:
    jwk-set-uri: http://keycloak:8080/realms/rescueops/protocol/openid-connect/certs
