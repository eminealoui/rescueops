# =====================================================================
#  ms-user - MS7 Utilisateurs (profils métier)
#  Port, nom Eureka et base sont FIXÉS par le contrat d'équipe : ne pas les changer.
# =====================================================================
server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: ms-user
  config:
    import: classpath:rescueops-logging.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/user_db}
    username: ${DB_USER:user_svc}
    password: ${DB_PASSWORD:dev_user}
  jpa:
    # Le schéma est créé par Flyway (src/main/resources/db/migration), jamais par Hibernate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # Instants stockés en UTC, que le service tourne sur le PC (UTC+1) ou dans Docker (UTC).
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

rescueops:
  keycloak:
    admin:
      # Compte de service du client confidentiel ms-user-admin (rôles manage-users, view-realm).
      base-url: ${KEYCLOAK_URL:http://localhost:8180}
      realm: rescueops
      client-id: ms-user-admin
      client-secret: ${KEYCLOAK_MS_USER_SECRET:dev_ms_user_admin}
